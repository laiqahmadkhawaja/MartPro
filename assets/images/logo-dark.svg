<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <!-- Cart & Leaf Icon for Dark Backgrounds -->
  <g transform="translate(4, 6)">
    <!-- Cart wheels -->
    <circle cx="20" cy="46" r="4.5" fill="#39E75F" />
    <circle cx="38" cy="46" r="4.5" fill="#39E75F" />
    <circle cx="20" cy="46" r="2" fill="#0F172A" />
    <circle cx="38" cy="46" r="2" fill="#0F172A" />
    <!-- Cart Body Basket -->
    <path d="M4 8h8l6.5 24h22l5.5-18H16" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Leaf integrated in cart -->
    <path d="M26 12 C26 12, 38 10, 39 2 C39 2, 28 4, 26 12 Z" fill="#39E75F" />
    <path d="M26 12 C30 18, 41 18, 42 10" stroke="#86EFAC" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="23" cy="22" r="3" fill="#22C55E" />
    <circle cx="32" cy="22" r="3" fill="#39E75F" />
  </g>
  <!-- Wordmark -->
  <text x="68" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" letter-spacing="-0.5" fill="#FFFFFF">Mart<tspan fill="#39E75F">Pro</tspan></text>
  <!-- Tagline -->
  <text x="70" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="8.5" letter-spacing="1.2" fill="#94A3B8" text-transform="uppercase">Smart Store. Better Business.</text>
</svg>
